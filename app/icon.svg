<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Core accretion gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for subtle bloom -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="64" height="64" rx="16" fill="url(#spaceBg)" />
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Outer tilted orbit ring -->
  <ellipse cx="32" cy="32" rx="23" ry="8.5" stroke="url(#ringGrad)" stroke-width="2.2" transform="rotate(-30 32 32)" stroke-dasharray="120" stroke-dashoffset="15" opacity="0.9" />

  <!-- Secondary subtle orbit ring -->
  <ellipse cx="32" cy="32" rx="18" ry="6.5" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(40 32 32)" />

  <!-- Orbiting planet / particle -->
  <circle cx="13" cy="21" r="2.8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="49" cy="41" r="1.8" fill="#f43f5e" />

  <!-- Glowing celestial core -->
  <circle cx="32" cy="32" r="13" fill="url(#coreGlow)" filter="url(#glow)" />
  
  <!-- Central event horizon / black hole eye -->
  <circle cx="32" cy="32" r="6" fill="#020617" />
  <circle cx="32" cy="32" r="6" stroke="#67e8f9" stroke-width="1.2" opacity="0.8" />

  <!-- Pulsar sparkle -->
  <path d="M32 24 L32.7 31.3 L40 32 L32.7 32.7 L32 40 L31.3 32.7 L24 32 L31.3 31.3 Z" fill="#ffffff" opacity="0.95" />
</svg>